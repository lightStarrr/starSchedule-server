# 使用服务器上已有的 PostgreSQL / Redis 时，用本文件代替 docker-compose.yml：
#
#   docker compose -f docker-compose.external.yml up -d
#
# 与主文件的区别：
#   - 不启动 postgres / redis 容器
#   - 连接信息直接取 .env 里的 DATABASE_URL / REDIS_ADDR（用 host.docker.internal 指向宿主机）
#   - 没有 migrate 容器：api 启动时会自己执行迁移
#
# 宿主机的 PostgreSQL / Redis 必须监听非回环地址（容器通过 docker bridge 访问），
# 详见 README 的「使用已有的 PostgreSQL / Redis」。
name: starschedule

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  APP_ENV: production
  APP_TZ: ${APP_TZ:-Asia/Shanghai}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: :8080
  DATABASE_URL: ${DATABASE_URL:?请在 .env 设置 DATABASE_URL，例如 postgres://starschedule:密码@host.docker.internal:5432/starschedule?sslmode=disable}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
  REDIS_ADDR: ${REDIS_ADDR:?请在 .env 设置 REDIS_ADDR，例如 host.docker.internal:6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  DEVICE_JWT_SECRET: ${DEVICE_JWT_SECRET:?}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
  DEVICE_TOKEN_TTL: ${DEVICE_TOKEN_TTL:-720h}
  DEVICE_TOKEN_REFRESH_AFTER: ${DEVICE_TOKEN_REFRESH_AFTER:-552h}
  ADMIN_TOKEN_TTL: ${ADMIN_TOKEN_TTL:-168h}
  DEVICE_FINGERPRINT_PEPPER: ${DEVICE_FINGERPRINT_PEPPER:?}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-false}

services:
  api:
    image: ${APP_IMAGE:?set APP_IMAGE in .env, e.g. ghcr.io/your-name/starschedule-server:latest}
    environment: *app-env
    # Linux 上通过 host-gateway 让容器能访问宿主机服务
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
