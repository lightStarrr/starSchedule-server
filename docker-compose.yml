name: starschedule

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  APP_ENV: production
  APP_TZ: ${APP_TZ:-Asia/Shanghai}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: :8080
  DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
  DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  REDIS_DB: "0"
  DEVICE_JWT_SECRET: ${DEVICE_JWT_SECRET:?}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
  DEVICE_TOKEN_TTL: ${DEVICE_TOKEN_TTL:-720h}
  DEVICE_TOKEN_REFRESH_AFTER: ${DEVICE_TOKEN_REFRESH_AFTER:-552h}
  ADMIN_TOKEN_TTL: ${ADMIN_TOKEN_TTL:-168h}
  DEVICE_FINGERPRINT_PEPPER: ${DEVICE_FINGERPRINT_PEPPER:?}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: ${APP_TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging
    # 不对外暴露端口：只允许容器网络内访问

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  # 一次性迁移容器：成功退出后 api 才启动。
  # api 自身启动时也会跑迁移（带 advisory lock，多副本安全），
  # 保留这一步是为了让「迁移失败」在 api 起来之前就暴露出来。
  migrate:
    image: ${APP_IMAGE:?set APP_IMAGE in .env, e.g. ghcr.io/your-name/starschedule-server:latest}
    command: ["-migrate-only"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    image: ${APP_IMAGE:?set APP_IMAGE in .env, e.g. ghcr.io/your-name/starschedule-server:latest}
    environment: *app-env
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  redisdata:
